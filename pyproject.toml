[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-reindex"
version = "0.1.0"
description = "Local-folder indexer profile for document-indexer"
requires-python = ">=3.12"
dependencies = [
    "document-indexer[docling,runtime] @ file:../document_indexer",
]

[tool.setuptools]
py-modules = ["main"]
